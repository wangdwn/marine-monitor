name: 海智数科 funding 数据自动采集

on:
  schedule:
    # 每周一 09:00（北京时间）自动采集；UTC 01:00
    - cron: "0 1 * * 1"
  workflow_dispatch:          # 手动触发按钮

permissions:
  contents: write             # 允许 push 数据回仓库
  actions: write             # 允许 dispatch 部署 workflow

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 采集资助项目 + 融资动态
        run: python3 collect_funding.py
        env:
          FUNDING_DIFF_OUT: ${{ runner.temp }}/funding_diff.json

      - name: 写采集摘要
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os
          p = os.path.join(os.environ.get('RUNNER_TEMP', '/tmp'), 'funding_diff.json')
          try:
              d = json.load(open(p, encoding='utf-8'))
          except Exception:
              d = {"date": "未知", "added_count": 0, "added": [], "total": "?"}
          lines = [f"## funding 采集摘要（{d.get('date')}）",
                   f"- 本次新增：{d.get('added_count', 0)} 条；库内共 {d.get('total', '?')} 条"]
          for a in d.get('added', [])[:20]:
              lines.append(f"- {a['name']}（{a.get('sourceOrg', '')}）")
          open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8').write('\n'.join(lines) + '\n')
          EOF

      - name: 有变化才提交
        id: pushdata
        run: |
          git config user.name "funding-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/public/data/funding.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交。"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: 自动采集 funding 数据 $(date +%Y-%m-%d)"
            # 并发推送保护：远端若已移动则 rebase 后重试
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "推送冲突，10 秒后重试 ($i/3) ..."
              sleep 10
            done
            git log --oneline -1
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 触发 Pages 重部署
        # 注意：workflow 内用 GITHUB_TOKEN 推送不会触发 deploy.yml，
        # 必须显式 dispatch，否则站点数据会滞后
        if: steps.pushdata.outputs.pushed == 'true'
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "已 dispatch Pages 部署。"
